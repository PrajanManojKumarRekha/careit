name: Feature request
description: Propose a scoped product or workflow improvement.
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe the workflow problem, without patient data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
      description: Describe measurable acceptance criteria.
    validations:
      required: true
